<!DOCTYPE html>
 <html>
<head>
    <meta charset="UTF-8">
    <title>CSS Grid Layout</title>
    <style>
        .container {
            display: grid;
        }
        .item{color: white;}
        .itemA{
            background-color: red;
            grid-row: 1/3;
            grid-column: 1/2;
        }
        .itemB{background-color: green;
               grid-row: 1/2;
               grid-column: 2/3;}
        .itemC{
            background-color: blue;
            grid-row: 2/3;
            grid-column: 2/3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item itemA">A</div>
        <div class="item itemB">B</div>
        <div class="item itemC">C</div>
    </div>
</body>
</html>
